[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=2.7.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cdt"
version = "0.1.0"
description = "Constrained Delaunay tetrahedrization made robust and practical"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later OR LGPL-3.0-or-later" }
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/MarcoAttene/CDT"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["python/cdt"]

[tool.scikit-build.cmake]
build-type = "Release"

[tool.scikit-build.cmake.define]
CDT_BUILD_PYTHON = "ON"
CDT_BUILD_EXECUTABLE = "OFF"
CDT_BUILD_MATLAB = "OFF"

[tool.cibuildwheel]
archs = "auto64"
build-verbosity = 1
test-command = "pytest {project}/python/tests"
test-requires = "pytest"
